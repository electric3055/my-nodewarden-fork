name: Notify Telegram on Update

on:
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]
  workflow_dispatch:

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Send Telegram notification if updated
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BEFORE_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          CURRENT_SHA=$(git rev-parse HEAD)

          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$CURRENT_SHA" = "$BEFORE_SHA" ]; then
            echo "No new commits synced. Skipping notification."
            exit 0
          fi

          VERSION=$(jq -r '.version' package.json)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${CURRENT_SHA}"

          TEXT=$(printf "🚀 <b>NodeWarden Updated</b>\n<b>Version:</b> <code>v%s</code>\n<b>Commit:</b> %s\n<a href=\"%s\">View Commit</a>" "$VERSION" "$COMMIT_MSG" "$COMMIT_URL")

          curl -sS -f -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="${TEXT}" \
            -d disable_web_page_preview=true
