name: Sync Upstream & Deploy NodeWarden

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest upstream release (shuaiplus/nodewarden)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/shuaiplus/nodewarden.git || true
          LATEST_TAG=$(curl -sS https://api.github.com/repos/shuaiplus/nodewarden/releases/latest | jq -r '.tag_name')
          echo "Syncing release tag: ${LATEST_TAG}"
          git fetch upstream tag "${LATEST_TAG}"
          # Merge upstream release while keeping local wrangler.toml database_id binding on conflict
          git merge "${LATEST_TAG}" -X ours --no-edit || true
          git push origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Deploy to Cloudflare Workers (R2 Mode)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm run build
          npm run deploy
